<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair with Weave</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#181818">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pairing">
  <div class="box">
    <img src="icon.svg" alt="">
    <h1 id="title">Opening Weave</h1>
    <p id="text">This code pairs your phone with a computer. If Weave doesn't open, tap the button.</p>
    <div class="buttons centered">
      <a class="button main" id="open" href="./">Open in Weave</a>
      <a class="button" href="./">Get Weave</a>
    </div>
  </div>
</div>
<script>
// The invitation is everything after the #. A browser never sends that part to a server, so
// the code stays between the computer's screen and this phone.
const invite = location.hash.slice(1);
const android = /Android/.test(navigator.userAgent);
const open = document.getElementById('open');
if (!invite) {
  document.getElementById('title').textContent = 'No code here';
  document.getElementById('text').textContent = 'Run weave pair on your computer and scan the code it shows.';
  open.hidden = true;
} else if (!android) {
  document.getElementById('title').textContent = 'Scan this with your phone';
  document.getElementById('text').textContent = 'This link pairs an Android phone with a computer. Open it on the phone that has Weave, or scan the code with Weave itself.';
  open.hidden = true;
} else {
  // Chrome hands this to the app, or falls back to the download page when Weave isn't installed
  const fallback = encodeURIComponent(new URL('./', location.href).href);
  open.href = 'intent://pair?' + invite + '#Intent;scheme=weave;package=com.t3lluz.weave;S.browser_fallback_url=' + fallback + ';end';
  location.replace(open.href);
}
</script>
</body>
</html>
