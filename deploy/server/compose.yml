# The Weave website on t3lluz.com/weave. See README.md next to this file.
#
# Run from ~/docker/weave, which holds the deploy checkout (repo/) and the
# built sites (build/):
#
#   docker compose -f repo/deploy/server/compose.yml --project-directory . up -d
#
# update.sh does exactly that after every push to master.
name: weave

services:
  weave:
    image: node:24-slim
    container_name: weave
    restart: unless-stopped
    user: "${WEAVE_UID:-1000}:${WEAVE_GID:-1000}"
    # A few static pages and one redirect: site/server.mjs, no dependencies.
    working_dir: /build/current
    command: ["node", "server.mjs"]
    environment:
      TZ: Europe/Oslo
      NODE_ENV: production
      PORT: "8080"
    volumes:
      - ./build:/build:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/weave/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      # Caddy (on the tailnet) reaches it as weave:8080.
      proxynet: {}
      # Cinema Info's Cloudflare tunnel (cinema-tunnel) reaches it as
      # weave:8080 for the public t3lluz.com/weave* route.
      edge: {}

networks:
  proxynet:
    external: true
    name: caddy_proxynet
  edge:
    external: true
    name: cinema-info_edge
