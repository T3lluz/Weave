name: Release APK

# Every push to master builds a signed APK and publishes it as a GitHub Release.
# The version is the commit count (0.1.<count>, versionCode <count>), so each push
# installs over the last one and nothing has to be bumped by hand.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weave-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          echo "code=$count" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$count" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:assembleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}
          # the in-app updater looks for Weave-<versionName>-vc<versionCode>.apk
          cp app/build/outputs/apk/release/app-release.apk "Weave-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}.apk"

      - name: Notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          git log $range --no-merges --pretty='- %s' > notes.md
          [ -s notes.md ] || echo "- ${{ github.event.head_commit.message || 'Build' }}" > notes.md
          echo "<!-- weave-version: ${{ steps.version.outputs.name }} vc${{ steps.version.outputs.code }} -->" >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" "Weave-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}.apk" \
            --title "Weave ${{ steps.version.outputs.name }}" --notes-file notes.md --target "$GITHUB_SHA"
