# The computer side's tests, on the two systems it runs on.
name: Computer side

on:
  push:
    paths: ['computer/**', '.github/workflows/computer.yml']
  pull_request:
    paths: ['computer/**']

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: computer
        run: python -m unittest discover -s tests
